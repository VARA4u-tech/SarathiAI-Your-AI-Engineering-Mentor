<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" /> <!-- Fuchsia -->
      <stop offset="100%" stop-color="#22d3ee" /> <!-- Cyan -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Ring with gaps for a modern tech feel -->
  <circle cx="60" cy="60" r="48" stroke="url(#grad1)" stroke-width="12" stroke-dasharray="100 40" stroke-linecap="round" transform="rotate(-30 60 60)" opacity="0.9" />
  
  <!-- Inner Core (The AI Brain / Guide) -->
  <circle cx="60" cy="60" r="18" fill="url(#grad1)" filter="url(#glow)" />
  
  <!-- Navigation / Compass Line indicating guidance -->
  <path d="M 60 60 L 95 25" stroke="url(#grad1)" stroke-width="10" stroke-linecap="round" />
</svg>
